[phases.setup]
nixPkgs = [
    "php83",
    "php83Packages.composer",
    "nodejs_20",
    "git",
    "php83Extensions.mysqli",
    "php83Extensions.gd",
    "php83Extensions.zip",
    "php83Extensions.curl",
    "php83Extensions.redis",
    "php83Extensions.mbstring",
    "php83Extensions.xml",
    "php83Extensions.bcmath",
    "php83Extensions.intl",
    "php83Extensions.exif",
    "php83Extensions.fileinfo",
    "php83Extensions.tokenizer",
    "php83Extensions.ctype",
    "php83Extensions.iconv",
    "php83Extensions.session",
    "php83Extensions.simplexml",
    "php83Extensions.pdo",
    "php83Extensions.pdo_mysql"
]

[phases.install]
cmds = [
    "composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader",
    "npm ci"
]

[phases.build]
cmds = [
    "npm run build",
    "php artisan config:cache",
    "php artisan route:cache",
    "php artisan view:cache"
]

[variables]
PHP_VERSION = "8.3"
NODE_VERSION = "20"
APP_ENV = "production"
APP_DEBUG = "false"
LOG_CHANNEL = "stderr"
LOG_LEVEL = "info"
NIXPACKS_PHP_ROOT_DIR = "/app/public"
NIXPACKS_PHP_FALLBACK_PATH = "/index.php"
COMPOSER_ALLOW_SUPERUSER = "1"

[healthCheck]
httpPath = "/health"
httpPort = "$PORT"
interval = 30
timeout = 10
retries = 3
