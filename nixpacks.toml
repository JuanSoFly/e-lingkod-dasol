# Nixpacks configuration for E-Lingkod Dasol HRIS on Railway
# This configures the build environment and deployment process

[phases.setup]
nixPkgs = ["...", "php83Extensions.redis"]

[phases.build]
cmds = [
    "npm ci",
    "npm run build",
    "mkdir -p storage/framework/cache storage/framework/sessions storage/framework/testing storage/framework/views storage/logs bootstrap/cache",
    "chmod -R 755 storage bootstrap/cache",
    "chmod -R 777 storage/framework/cache storage/framework/sessions storage/framework/views storage/logs bootstrap/cache",
    "php artisan storage:link"
]

[start]
cmd = "bash -lc 'php artisan config:clear && php artisan route:clear && php artisan view:clear && php -S 0.0.0.0:$PORT -t public public/router.php'"

[variables]
PHP_VERSION = "8.3"
NODE_VERSION = "22"
APP_ENV = "production"
APP_DEBUG = "false"
APP_URL = "${RAILWAY_PUBLIC_URL}"
ASSET_URL = ""
FORCE_HTTPS = "true"
LOG_CHANNEL = "stderr"
LOG_LEVEL = "error"
LOG_DEPRECATIONS_CHANNEL = "null"
VIEW_COMPILED_PATH = "storage/framework/views"

# PHP Configuration
PHP_MEMORY_LIMIT = "512M"
PHP_MAX_EXECUTION_TIME = "300"
PHP_UPLOAD_MAX_FILESIZE = "64M"
PHP_POST_MAX_SIZE = "64M"

# Laravel Optimization
COMPOSER_ALLOW_SUPERUSER = "1"
COMPOSER_MEMORY_LIMIT = "2G"

[build.env]
COMPOSER_ALLOW_SUPERUSER = "1"
COMPOSER_MEMORY_LIMIT = "2G"
NODE_ENV = "production"
PHP_EXTENSIONS = "redis"

[start.env]
APP_ENV = "production"
APP_DEBUG = "false"
LOG_CHANNEL = "stderr"
