[phases.setup]
nixPkgs = [
    "php83",
    "php83Packages.composer",
    "nodejs_20",
    "git",
    "php83Extensions.mysqli",
    "php83Extensions.gd",
    "php83Extensions.zip",
    "php83Extensions.curl",
    "php83Extensions.mbstring",
    "php83Extensions.xml",
    "php83Extensions.bcmath",
    "php83Extensions.tokenizer",
    "php83Extensions.openssl",
    "php83Extensions.pdo_mysql",
    "php83Extensions.dom",
    "php83Extensions.fileinfo"
]

# Pin Nixpkgs to a stable version for reproducible builds
nixpkgsUrl = "https://github.com/NixOS/nixpkgs/archive/24.05.tar.gz"

[phases.install]
cmds = [
    "composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader",
    "npm ci"
]

[phases.build]
cmds = [
    "npm run build",
    "php artisan storage:link",
    "php artisan config:cache",
    "php artisan migrate --force"
]

[variables]
PHP_VERSION = "8.3"
NODE_VERSION = "20"
APP_ENV = "production"
APP_DEBUG = "false"
APP_URL = "${RAILWAY_PUBLIC_URL}"
APP_KEY = "base64:SWLhXQa+HwGZ1lUAdJxQ1luTfpv1hmxTnzQ5V2Uiz2Y="
LOG_CHANNEL = "stderr"
LOG_LEVEL = "error"
LOG_DEPRECATIONS_CHANNEL = "null"
NIXPACKS_PHP_ROOT_DIR = "/app/public"
NIXPACKS_PHP_FALLBACK_PATH = "/index.php"
COMPOSER_ALLOW_SUPERUSER = "1"
COMPOSER_MEMORY_LIMIT = "2G"
PHP_MEMORY_LIMIT = "512M"
PHP_MAX_EXECUTION_TIME = "300"
PHP_UPLOAD_MAX_FILESIZE = "64M"
PHP_POST_MAX_SIZE = "64M"
SESSION_DRIVER = "redis"
CACHE_DRIVER = "redis"
QUEUE_CONNECTION = "redis"

# Database Configuration (Railway provides these automatically)
DB_CONNECTION = "mysql"
DB_HOST = "${{RAILWAY_PRIVATE_MYSQL_SERVICE_HOST}}"
DB_PORT = "${{RAILWAY_PRIVATE_MYSQL_SERVICE_PORT}}"
DB_DATABASE = "${{RAILWAY_PRIVATE_MYSQL_SERVICE_DATABASE}}"
DB_USERNAME = "${{RAILWAY_PRIVATE_MYSQL_SERVICE_USERNAME}}"
DB_PASSWORD = "${{RAILWAY_PRIVATE_MYSQL_SERVICE_PASSWORD}}"

# Redis Configuration (Railway provides these automatically)
REDIS_HOST = "${{RAILWAY_PRIVATE_REDIS_SERVICE_HOST}}"
REDIS_PORT = "${{RAILWAY_PRIVATE_REDIS_SERVICE_PORT}}"
REDIS_PASSWORD = "${{RAILWAY_PRIVATE_REDIS_SERVICE_PASSWORD}}"

[healthCheck]
httpPath = "/health"
httpPort = "$PORT"
interval = 30
timeout = 15
retries = 3
startPeriod = 60
