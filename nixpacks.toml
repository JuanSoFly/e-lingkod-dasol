# Nixpacks configuration for E-Lingkod Dasol HRIS on Railway
# This configures the build environment and deployment process

[phases.setup]
nixPkgs = [
    "nodejs_22",
    "php83",
    "php83Packages.composer",
    "php83Extensions.curl",
    "php83Extensions.fileinfo",
    "php83Extensions.mbstring",
    "php83Extensions.openssl",
    "php83Extensions.pdo_mysql",
    "php83Extensions.redis",
    "php83Extensions.opcache"
]

[phases.build]
cmds = [
    "composer install --no-dev --prefer-dist --optimize-autoloader",
    "php artisan config:cache",
    "php artisan route:cache",
    "php artisan view:cache",
    "php artisan event:cache",
    "npm ci",
    "npm run build",
    "mkdir -p storage/framework/cache storage/framework/sessions storage/framework/testing storage/framework/views storage/logs bootstrap/cache",
    "chmod -R 755 storage bootstrap/cache",
    "chmod -R 775 storage/framework/cache storage/framework/sessions storage/framework/views storage/logs bootstrap/cache",
    "php artisan storage:link"
]

[start]
cmd = "bash -lc 'php artisan migrate --force && php -d opcache.enable_cli=1 -S 0.0.0.0:$PORT -t public public/router.php'"

[variables]
PHP_VERSION = "8.3"
NODE_VERSION = "22"
APP_ENV = "production"
APP_DEBUG = "false"
APP_URL = "${RAILWAY_PUBLIC_URL}"
ASSET_URL = ""
FORCE_HTTPS = "true"
CACHE_DRIVER = "redis"
SESSION_DRIVER = "redis"
QUEUE_CONNECTION = "redis"
LOG_CHANNEL = "stderr"
LOG_LEVEL = "error"
LOG_DEPRECATIONS_CHANNEL = "null"
VIEW_COMPILED_PATH = "storage/framework/views"

# PHP Configuration
PHP_MEMORY_LIMIT = "512M"
PHP_MAX_EXECUTION_TIME = "300"
PHP_UPLOAD_MAX_FILESIZE = "64M"
PHP_POST_MAX_SIZE = "64M"

# Laravel Optimization
COMPOSER_ALLOW_SUPERUSER = "1"
COMPOSER_MEMORY_LIMIT = "2G"

[build.env]
COMPOSER_ALLOW_SUPERUSER = "1"
COMPOSER_MEMORY_LIMIT = "2G"
NODE_ENV = "production"

[start.env]
APP_ENV = "production"
APP_DEBUG = "false"
LOG_CHANNEL = "stderr"
