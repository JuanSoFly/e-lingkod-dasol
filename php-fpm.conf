[global]
pid = /tmp/php-fpm.pid
error_log = /dev/stderr
daemonize = no

[www]
user = www-data
group = www-data

; Use TCP socket for Nginx communication (more reliable in Docker/Nixpacks)
listen = 127.0.0.1:9000

; Process manager - dynamic scales workers based on traffic
; Tuned for 0.5 GB RAM (each worker uses ~40-60 MB)
pm = dynamic
pm.max_children = 4
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500

; Timeouts
request_terminate_timeout = 300s

; Logging
access.log = /dev/stdout
catch_workers_output = yes
decorate_workers_output = no

; PHP settings (conservative for 0.5 GB)
php_admin_value[memory_limit] = 128M
php_admin_value[upload_max_filesize] = 64M
php_admin_value[post_max_size] = 64M
php_admin_value[max_execution_time] = 300
php_admin_value[opcache.enable] = 1
php_admin_value[opcache.memory_consumption] = 64
php_admin_value[opcache.max_accelerated_files] = 10000
php_admin_value[opcache.validate_timestamps] = 0
